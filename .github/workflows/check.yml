name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本以 package.json 的 packageManager 为准，这里不要再写 version
      # （两处都写会报 ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      # 发布版要编译成 JS（node_modules 里不允许 TS 类型剥离），所以构建是必须过的一步。
      # **放在测试之前**：有一条守卫测试从 `lib/` 加载编译产物，检查发布版里的包根与脚本
      # 入口（源码布局下这个错误看不出来，见 src/tests/runtime.test.ts）。
      - name: 构建插件包
        run: pnpm --filter dsh-foldercast prepack

      - name: 单元与集成测试
        run: pnpm run test

      # 讲稿现写一份最小的（script.json 是创作产物、不进版本库），验三条不依赖外部
      # 工具的路径：契约校验、计划计算、以及「缺浏览器时的结构化引导」。
      - name: 讲稿校验与无浏览器渲染引导
        run: |
          mkdir -p .foldercast
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(".foldercast/script.json", JSON.stringify({
              foldercast: 1,
              source: { root: process.cwd() },
              title: "foldercast",
              scenes: [
                { id: "cover", type: "cover", title: "foldercast", subtitle: "目录放映", narration: "这是 foldercast 自己的目录。" },
                { id: "layout", type: "tree", title: "结构",
                  entries: [
                    { path: "packages", files: 20, highlight: true },
                    { path: "docs", files: 3 },
                    { path: "scripts", files: 6 }
                  ],
                  narration: "代码在 packages，契约在 docs，工具在 scripts。" },
                { id: "kinds", type: "inventory", title: "构成",
                  groups: [{ label: "代码", count: 25 }, { label: "文档", count: 6 }],
                  total: 31,
                  narration: "内容以代码为主，文档其次。" },
                { id: "outro", type: "outro", title: "完", narration: "就这些。" }
              ]
            }, null, 2));
          '
          # --check 不碰浏览器，任何机器上都要成功
          pnpm run render . --check

          # 真渲染分两种情况，两条都算通过：
          #   · 有浏览器 → 出片（装了 Chrome 的机器走这条）
          #   · 没有浏览器 → 结构化引导 + 退出码 3（这一层 CI 走这条，也是要钉住的行为）
          set +e
          pnpm run render . --json > render.json 2> render.log
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            test -s .foldercast/out/video.mp4 || { echo "退出码 0 但没有成片"; exit 1; }
            echo "有浏览器：已出片"
          elif [ "$code" = "3" ]; then
            grep -q "remotion browser ensure" render.json render.log || { echo "退出码 3 但没给出引导"; cat render.json render.log; exit 1; }
            echo "没有浏览器：给出了结构化引导"
          else
            echo "渲染既没成功也没给出引导，退出码 $code"; cat render.log; exit 1
          fi
          rm -f render.json render.log

      # 配音：runner 上没有 say、也没有 ffmpeg，能验的是**前置检查与引导**（退出码非 0
      # 且有可操作的话）。真配音由本机验收。
      - name: 配音的前置检查
        run: |
          set +e
          pnpm run voice . --json > voice.json 2> voice.log
          code=$?
          set -e
          echo "缺工具时的退出码：$code"
          test "$code" != "0" || { echo "这台 runner 上配音不该成功"; cat voice.json; exit 1; }
          grep -qiE "ffmpeg|say" voice.json voice.log || { echo "失败信息里没有指出缺哪个工具"; cat voice.json voice.log; exit 1; }
          rm -f voice.json voice.log

      - name: 检查相对链接
        run: pnpm run check:links

      - name: 校验 JSON 合法性
        run: pnpm run check:json

      - name: 校验示例符合 schema
        run: pnpm run check:examples
