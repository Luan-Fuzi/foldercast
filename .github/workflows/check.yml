name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: 文档与契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本以 package.json 的 packageManager 为准，这里不要再写 version
      # （两处都写会报 ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元与集成测试
        run: pnpm run test

      # 拿仓库自身当用例跑一遍工具链：分析器产出的解读必须能过契约校验。
      # 解读不进版本库（可重算），所以这里先生成再校验。
      - name: 分析本仓库并校验解读
        run: |
          pnpm run analyze .
          pnpm run validate .

      - name: 检查相对链接
        run: pnpm run check:links

      - name: 校验 JSON 合法性
        run: pnpm run check:json

      - name: 校验风格预设 token 一致性
        run: pnpm run check:styles

      - name: 校验示例符合 schema
        run: pnpm run check:examples
