name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
  pack:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 校验标签与版本
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/plugin/package.json"));
            if (!/^\d+\.\d+\.\d+(?:-rc\.\d+)?$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("必须从与插件版本一致的 v 标签发布");
          '
      - run: pnpm --filter dsh-foldercast prepack
      - name: 打包一次
        run: |
          mkdir -p release
          cd packages/plugin
          npm pack --ignore-scripts --pack-destination ../../release --json > ../../release/pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/
  smoke:
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: 隔离安装实际包
        run: |
          mkdir -p isolated
          npm install --prefix isolated --omit=dev "$(pwd)"/release/*.tgz
      - name: 验收 JS 入口、契约、HTML 与异常引导
        env:
          FOLDERCAST_SMOKE_RENDER: '1'
        run: node scripts/package-smoke.ts isolated
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: npm 与 GitHub 发布同一份包
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-package.ts release
